name: CI

# master push와 Pull Request마다 Backend/Frontend 품질 검사를 실행한다.
# Backend 테스트는 인메모리 SQLite와 가짜 Storage를 사용하고, Frontend 빌드는
# Supabase 환경변수 없이도 통과하므로 이 워크플로에는 Secret이 필요하지 않다.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # backend/pyproject.toml의 requires-python = ">=3.12" 선언을 따른다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # NEXT_PUBLIC_* 값은 빌드 시 번들에 포함되지만, 여기서는 빌드 성공 여부만
      # 검증하고 산출물을 배포하지 않으므로 실제 키를 주입하지 않는다.
      - name: Build
        run: npm run build
