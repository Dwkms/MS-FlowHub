name: E2E (manual)

# 이 워크플로는 자동 실행되지 않는다. Actions 탭에서 직접 실행할 때만 동작한다.
#
# 주의: E2E는 실제 Supabase 프로젝트에 접속해 전용 테스트 직원 2명
# (E2E0001 / E2E0002, @msflowhub.test)을 만들고 종료 시 지운다. 운영 직원
# 46명(MS0001~)은 건드리지 않지만, 서비스 롤 키를 사용하므로 push마다
# 자동 실행하지 않고 필요할 때만 수동으로 돌린다.
#
# 실행하려면 아래 Secret이 저장소에 등록되어 있어야 한다.
#   DATABASE_URL, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
#   SUPABASE_SECRET_KEY, SUPABASE_JWKS_URL,
#   E2E_EMPLOYEE_PASSWORD, E2E_SUPER_ADMIN_PASSWORD,
#   E2E_PASSWORD_CHANGE_NEW_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read

# 같은 E2E 계정을 두 실행이 동시에 만들고 지우면 충돌하므로 직렬화한다.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          # venv가 없는 러너이므로 시스템 Python과 uvicorn 명령을 직접 지정한다.
          E2E_PYTHON: python
          E2E_BACKEND_COMMAND: python -m uvicorn app.main:app --app-dir backend --port 8000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          E2E_EMPLOYEE_EMAIL: e2e-employee@msflowhub.test
          E2E_SUPER_ADMIN_EMAIL: e2e-super-admin@msflowhub.test
          E2E_SUPER_ADMIN_EMPLOYEE_ID: emp-e2e-super-admin
          E2E_PASSWORD_CHANGE_EMAIL: e2e-employee@msflowhub.test
          E2E_EMPLOYEE_PASSWORD: ${{ secrets.E2E_EMPLOYEE_PASSWORD }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_PASSWORD_CHANGE_CURRENT_PASSWORD: ${{ secrets.E2E_EMPLOYEE_PASSWORD }}
          E2E_PASSWORD_CHANGE_NEW_PASSWORD: ${{ secrets.E2E_PASSWORD_CHANGE_NEW_PASSWORD }}
        run: npx playwright test

      - name: Upload trace and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
