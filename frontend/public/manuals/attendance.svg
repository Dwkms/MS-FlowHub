<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title>근태와 휴가 한눈에 보기</title><rect width="960" height="540" fill="#fff6eb"/><text x="90" y="105" fill="#a56520" font-family="Arial,sans-serif" font-size="34" font-weight="700">근태 · 휴가</text><rect x="90" y="155" width="780" height="235" rx="24" fill="#fff"/><circle cx="198" cy="270" r="65" fill="#ffe7c6"/><text x="164" y="282" fill="#aa6c24" font-family="Arial,sans-serif" font-size="30" font-weight="700">오늘</text><text x="315" y="230" fill="#3f4c5d" font-family="Arial,sans-serif" font-size="23">근무 상태 선택</text><text x="315" y="278" fill="#3f4c5d" font-family="Arial,sans-serif" font-size="23">필요한 사유 입력</text><text x="315" y="326" fill="#3f4c5d" font-family="Arial,sans-serif" font-size="23">민감한 내용은 비공개 메모로 구분</text><text x="90" y="455" fill="#745f4a" font-family="Arial,sans-serif" font-size="22">병가·결근은 사유 요약을 반드시 기록합니다.</text></svg>
