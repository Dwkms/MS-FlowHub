<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title>로그인과 계정 한눈에 보기</title><rect width="960" height="540" fill="#eff5ff"/><rect x="88" y="72" width="784" height="396" rx="30" fill="#fff"/><text x="142" y="155" fill="#315f9e" font-family="Arial,sans-serif" font-size="32" font-weight="700">로그인 · 계정</text><text x="142" y="208" fill="#283b56" font-family="Arial,sans-serif" font-size="22">1. 회사 이메일 입력</text><text x="142" y="258" fill="#283b56" font-family="Arial,sans-serif" font-size="22">2. 비밀번호 확인 후 로그인</text><text x="142" y="308" fill="#283b56" font-family="Arial,sans-serif" font-size="22">3. 설정 메뉴에서 비밀번호 변경</text><rect x="142" y="350" width="590" height="52" rx="12" fill="#3468ad"/><text x="172" y="384" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">문제가 있으면 로그인 정보를 다시 확인하세요</text></svg>
